blueprint:
  name: "Tra cứu dữ liệu SQL (nhiều bảng)"
  description: >
    Tool cho Trợ lý thoại / AI Agent chạy truy vấn SELECT trên nhiều bảng
    Postgre khác nhau, dùng CHUNG 1 script cho toàn bộ. Danh sách bảng được
    phép truy vấn (tên bảng thật, các cột lấy ra, cột dùng sắp xếp/tìm kiếm)
    định nghĩa trong input "danh_sach_bang" — thêm bảng mới chỉ cần sửa input
    này, không cần tạo blueprint hay script mới. LLM truyền tên "bảng logic"
    (key trong whitelist) khi gọi tool.
  domain: script
  input:
    danh_sach_bang:
      name: Danh sách bảng được phép truy vấn
      description: >
        Dạng dict: key là tên bảng logic (LLM sẽ dùng tên này), value gồm
        'bang' (tên bảng thật trong DB), 'cot' (list cột SELECT),
        'cot_sap_xep' (cột dùng ORDER BY ... DESC),
        'cot_tim_kiem' (cột dùng lọc theo từ khóa — có thể là 1 cột dạng text,
        hoặc 1 LIST nhiều cột để tìm khớp bất kỳ cột nào, ví dụ
        [ma_thiet_bi, ten_thiet_bi]; có thể bỏ trống),
        'db_url' (BẮT BUỘC - chuỗi kết nối Postgres, đúng cái đã dùng khi tạo
        SQL sensor cho bảng này, ví dụ postgresql://user:pass@core-postgresql:5432/homeassistant).
      default:
        tin_tuc:
          bang: vnnew
          cot: [title, contentsnippet, link, isodate]
          cot_sap_xep: isodate
          cot_tim_kiem: title
          db_url: "postgresql://user:password@host:5432/database"
      selector:
        object:
    gioi_han_mac_dinh:
      name: Số dòng mặc định
      default: 5
      selector:
        number:
          min: 1
          max: 20
          mode: box

fields:
  bang:
    name: Bảng logic cần tra cứu
    description: >
      Tên bảng logic (key trong danh sách bảng đã định nghĩa), ví dụ "tin_tuc".
    required: true
    example: "tin_tuc"
    selector:
      text:
  tu_khoa:
    name: Từ khóa (không bắt buộc)
    description: Lọc theo cột tìm kiếm của bảng đó. Bỏ trống để lấy mới nhất.
    required: false
    selector:
      text:
  so_luong:
    name: Số lượng (không bắt buộc)
    required: false
    selector:
      number:
        min: 1
        max: 20
        mode: box

sequence:
  - variables:
      danh_sach_bang: !input danh_sach_bang
      mac_dinh_so_luong: !input gioi_han_mac_dinh
  - variables:
      cau_hinh: "{{ danh_sach_bang.get(bang) }}"
      cac_bang_hop_le: "{{ danh_sach_bang.keys() | join(', ') }}"
      tu_khoa_loc: "{{ (tu_khoa | default('', true)) | trim | replace(\"'\", \"''\") }}"
      so_dong: "{{ (so_luong | default(mac_dinh_so_luong, true)) | int }}"
  - if:
      - "{{ cau_hinh is none }}"
    then:
      - variables:
          ket_qua:
            thong_tin: >-
              Bảng "{{ bang }}" không tồn tại trong danh sách được phép tra cứu.
              Các bảng hợp lệ: {{ cac_bang_hop_le }}.
      - stop: ""
        response_variable: ket_qua
  - variables:
      danh_sach_cot: "{{ cau_hinh.cot | join(', ') }}"
      cot_sap_xep: "{{ cau_hinh.get('cot_sap_xep') }}"
      cot_tim_kiem_raw: "{{ cau_hinh.get('cot_tim_kiem') }}"
      ten_bang_that: "{{ cau_hinh.bang }}"
  - variables:
      tu_khoa_norm: "{{ tu_khoa_loc | replace('-', '') | replace(' ', '') }}"
  - variables:
      dieu_kien_tim_kiem: >
        {% set cols = [cot_tim_kiem_raw] if cot_tim_kiem_raw is string else (cot_tim_kiem_raw or []) %}
        {% set ns3 = namespace(parts=[]) %}
        {% for c in cols %}
          {% set ns3.parts = ns3.parts + ["REPLACE(REPLACE(" ~ c ~ ", '-', ''), ' ', '') ILIKE '%" ~ tu_khoa_norm ~ "%'"] %}
        {% endfor %}
        {{ '(' ~ (ns3.parts | join(' OR ')) ~ ')' if ns3.parts else '' }}
  - variables:
      cau_query: >
        {% if cot_sap_xep and tu_khoa_loc and dieu_kien_tim_kiem %}
        SELECT {{ danh_sach_cot }} FROM {{ ten_bang_that }} WHERE {{ dieu_kien_tim_kiem }} ORDER BY {{ cot_sap_xep }} DESC LIMIT {{ so_dong }};
        {% elif cot_sap_xep %}
        SELECT {{ danh_sach_cot }} FROM {{ ten_bang_that }} ORDER BY {{ cot_sap_xep }} DESC LIMIT {{ so_dong }};
        {% elif tu_khoa_loc and dieu_kien_tim_kiem %}
        SELECT {{ danh_sach_cot }} FROM {{ ten_bang_that }} WHERE {{ dieu_kien_tim_kiem }} LIMIT {{ so_dong }};
        {% else %}
        SELECT {{ danh_sach_cot }} FROM {{ ten_bang_that }} LIMIT {{ so_dong }};
        {% endif %}
  - action: sql.query
    data:
      query: "{{ cau_query }}"
      db_url: "{{ cau_hinh.db_url }}"
    response_variable: sql_result
  - variables:
      ket_qua_text: >
        {% set rows = sql_result.result if sql_result is mapping and 'result' in sql_result else sql_result %}
        {% if rows | count == 0 %}
        Không tìm thấy dữ liệu nào trong bảng "{{ bang }}"{% if tu_khoa_loc %} khớp từ khóa "{{ tu_khoa_loc }}"{% endif %}.
        {% else %}
        {% for r in rows %}
        --- Tin {{ loop.index }} ---
        {% for c in cau_hinh.cot %}{{ c }}: {{ r[c] }}
        {% endfor %}
        {% endfor %}
        {% endif %}
  - variables:
      ket_qua:
        thong_tin: "{{ ket_qua_text }}"
  - stop: ""
    response_variable: ket_qua
