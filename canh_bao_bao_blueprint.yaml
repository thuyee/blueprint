blueprint:
  name: Cảnh báo bão KTTV -> Zalo (Multi UI Chuẩn) / Mobile
  description: >
    Kiểm tra định kỳ bản tin bão mới từ Trung tâm Dự báo KTTV,
    format bằng AI agent và gửi qua nhiều Zalo + thông báo điện thoại.
  domain: automation
  input:
    check_interval:
      name: Tần suất kiểm tra
      description: Bao lâu kiểm tra RSS 1 lần
      default: "/15"
      selector:
        select:
          options:
            - label: "5 phút"
              value: "/5"
            - label: "15 phút"
              value: "/15"
            - label: "30 phút"
              value: "/30"
            - label: "60 phút"
              value: "/60"

    agent_id:
      name: AI Agent
      description: Agent dùng để format bản tin theo mẫu. Để trống nếu chưa có agent nào.
      default: ""
      selector:
        conversation_agent: {}

    notify_device:
      name: Thiết bị nhận thông báo
      description: Chọn 1 hoặc nhiều điện thoại/thiết bị nhận thông báo app HA
      selector:
        device:
          integration: mobile_app
          multiple: true

    # ZALO 1 (Bắt buộc/Mặc định)
    zalo_1_thread_id:
      name: "Zalo 1 - Thread ID"
      default: "1058896116335801995"
      selector:
        text: {}

    zalo_1_account:
      name: "Zalo 1 - Account Selection"
      default: "+84868837123"
      selector:
        text: {}

    zalo_1_type:
      name: "Zalo 1 - Loại thread"
      default: "1"
      selector:
        select:
          mode: list
          options:
            - label: "User (cá nhân)"
              value: "0"
            - label: "Group (nhóm)"
              value: "1"

    # ZALO 2
    zalo_2_thread_id:
      name: "Zalo 2 - Thread ID (Để trống nếu không dùng)"
      default: ""
      selector:
        text: {}

    zalo_2_account:
      name: "Zalo 2 - Account Selection"
      default: "+84868837123"
      selector:
        text: {}

    zalo_2_type:
      name: "Zalo 2 - Loại thread"
      default: "0"
      selector:
        select:
          mode: list
          options:
            - label: "User (cá nhân)"
              value: "0"
            - label: "Group (nhóm)"
              value: "1"

    # ZALO 3
    zalo_3_thread_id:
      name: "Zalo 3 - Thread ID (Để trống nếu không dùng)"
      default: ""
      selector:
        text: {}

    zalo_3_account:
      name: "Zalo 3 - Account Selection"
      default: "+84868837123"
      selector:
        text: {}

    zalo_3_type:
      name: "Zalo 3 - Loại thread"
      default: "0"
      selector:
        select:
          mode: list
          options:
            - label: "User (cá nhân)"
              value: "0"
            - label: "Group (nhóm)"
              value: "1"

trigger:
  - trigger: time_pattern
    minutes: !input check_interval

condition: []

action:
  - action: pyscript.tao_canh_bao_bao
    data:
      agent_id: !input agent_id
    response_variable: ket_qua

  - if:
      - condition: template
        value_template: "{{ ket_qua.has_new }}"
    then:
      # 1. Gửi Mobile App HA
      - action: notify.send_message
        target:
          device_id: !input notify_device
        data:
          title: "Cảnh báo bão"
          message: "{{ ket_qua.message_short }}"

      # 2. Lặp qua danh sách Zalo bằng Jinja Filter (Tự động loại bỏ Zalo bị để trống)
      - repeat:
          for_each: >-
            {% set z1 = {'thread_id': inputs.zalo_1_thread_id, 'account': inputs.zalo_1_account, 'type': inputs.zalo_1_type} %}
            {% set z2 = {'thread_id': inputs.zalo_2_thread_id, 'account': inputs.zalo_2_account, 'type': inputs.zalo_2_type} %}
            {% set z3 = {'thread_id': inputs.zalo_3_thread_id, 'account': inputs.zalo_3_account, 'type': inputs.zalo_3_type} %}
            {% set items = [z1, z2, z3] %}
            {{ items | selectattr('thread_id', 'defined') | selectattr('thread_id', 'ne', '') | list }}
          sequence:
            - action: zalo_bot.send_message
              data:
                thread_id: "{{ repeat.item.thread_id }}"
                account_selection: "{{ repeat.item.account }}"
                type: "{{ repeat.item.type }}"
                message: "{{ ket_qua.message }}"

mode: single
