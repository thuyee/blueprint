blueprint:
  name: Cảnh báo bão KTTV -> Zalo (Multi) / Mobile
  description: >
    Kiểm tra định kỳ bản tin bão mới từ Trung tâm Dự báo KTTV,
    format bằng AI agent và gửi qua nhiều Zalo + thông báo điện thoại.
  domain: automation
  input:
    check_interval:
      name: Tần suất kiểm tra
      description: Bao lâu kiểm tra RSS 1 lần
      default: "/15"
      selector:
        select:
          options:
            - label: "5 phút"
              value: "/5"
            - label: "15 phút"
              value: "/15"
            - label: "30 phút"
              value: "/30"
            - label: "60 phút"
              value: "/60"

    agent_id:
      name: AI Agent
      description: Agent dùng để format bản tin theo mẫu. Để trống nếu chưa có agent nào.
      default: ""
      selector:
        conversation_agent: {}

    notify_device:
      name: Thiết bị nhận thông báo
      description: Chọn 1 hoặc nhiều điện thoại/thiết bị nhận thông báo app HA
      selector:
        device:
          integration: mobile_app
          multiple: true

    zalo_list:
      name: Danh sách Zalo nhận tin (YAML List)
      description: >
        Nhập danh sách Zalo nhận tin dạng YAML.
        Cú pháp:
        - thread_id: "1058896116335801995"
          account: "+84868837123"
          type: "1"
        - thread_id: "987654321098765432"
          account: "+84868837123"
          type: "0"
      default: |
        - thread_id: "1058896116335801995"
          account: "+84868837123"
          type: "1"
      selector:
        text:
          multiline: true

trigger:
  - trigger: time_pattern
    minutes: !input check_interval

condition: []

action:
  - action: pyscript.tao_canh_bao_bao
    data:
      agent_id: !input agent_id
    response_variable: ket_qua

  - if:
      - condition: template
        value_template: "{{ ket_qua.has_new }}"
    then:
      # 1. Gửi Mobile App HA
      - action: notify.send_message
        target:
          device_id: !input notify_device
        data:
          title: "Cảnh báo bão"
          message: "{{ ket_qua.message_short }}"

      # 2. Vòng lặp gửi cho danh sách Zalo (Dùng repeat for_each)
      - repeat:
          for_each: "!input zalo_list"
          sequence:
            - action: zalo_bot.send_message
              data:
                thread_id: "{{ repeat.item.thread_id }}"
                account_selection: "{{ repeat.item.account }}"
                type: "{{ repeat.item.type }}"
                message: "{{ ket_qua.message }}"

mode: single
