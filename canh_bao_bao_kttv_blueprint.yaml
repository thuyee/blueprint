blueprint:
  name: Cảnh báo bão KTTV -> Zalo/Mobile/Telegram
  description: >
    Kiểm tra định kỳ bản tin bão mới từ Trung tâm Dự báo KTTV,
    format bằng AI agent và gửi qua Zalo + Telegram + thông báo điện thoại + các hành động tùy chọn thêm.
    Yêu cầu: đã cài pyscript và copy file canh_bao_bao.py vào /config/pyscript/,
    đã tạo helper input_text.canh_bao_bao_last_title.
  domain: automation
  input:
    check_interval:
      name: Tần suất kiểm tra
      description: Bao lâu kiểm tra RSS 1 lần
      default: "/15"
      selector:
        select:
          options:
            - label: "5 phút"
              value: "/5"
            - label: "15 phút"
              value: "/15"
            - label: "30 phút"
              value: "/30"
            - label: "60 phút"
              value: "/60"

    agent_id:
      name: AI Agent
      description: Agent dùng để format bản tin theo mẫu. Để trống nếu chưa có agent nào, sẽ gửi nội dung thô.
      default: ""
      selector:
        conversation_agent: {}

    notify_device:
      name: Thiết bị nhận thông báo
      description: Chọn 1 hoặc nhiều điện thoại/thiết bị sẽ nhận thông báo qua app Home Assistant
      selector:
        device:
          integration: mobile_app
          multiple: true

    zalo_thread_id:
      name: Zalo Thread ID
      description: ThreadId nhận tin nhắn (user hoặc group)
      default: "1058896116335801995"
      selector:
        text: {}

    zalo_type:
      name: Loại thread Zalo
      description: Thread ID ở trên là của 1 người dùng hay 1 nhóm
      default: "1"
      selector:
        select:
          mode: list
          options:
            - label: "User (cá nhân)"
              value: "0"
            - label: "Group (nhóm)"
              value: "1"

    zalo_account:
      name: Zalo Account Selection
      default: "+84868837123"
      selector:
        text: {}

    # ===== TELEGRAM =====
    enable_telegram:
      name: Gửi thông báo qua Telegram
      selector:
        boolean: {}
      default: true

    telegram_service:
      name: Telegram notify service
      description: >
        Service dùng để gửi Telegram. Mặc định notify.thuyeeqb_hassbot — service
        đã cấu hình sẵn chat_id trong configuration.yaml. Đổi nếu bạn dùng bot
        khác, ví dụ notify.telegram hoặc notify.send_message.
      selector:
        text: {}
      default: notify.thuyeeqb_hassbot

    additional_actions:
      name: Hành động bổ sung (Thêm Zalo 2, Zalo 3, Bật loa...)
      description: >
        Thêm các hành động tùy chỉnh sẽ chạy khi có bản tin bão mới.
        Bạn có thể bấm "+ ADD ACTION" để thêm dịch vụ zalo_bot.send_message cho các Zalo khác.
        (Nội dung tin nhắn sử dụng template: {{ ket_qua.message }})
      default: []
      selector:
        action: {}

trigger:
  - trigger: time_pattern
    minutes: !input check_interval

condition: []

action:
  - variables:
      enable_telegram: !input enable_telegram
      telegram_service: !input telegram_service

  - action: pyscript.tao_canh_bao_bao
    data:
      agent_id: !input agent_id
    response_variable: ket_qua

  - if:
      - condition: template
        value_template: "{{ ket_qua.has_new }}"
    then:
      # 1. Thông báo qua Mobile App HA
      - action: notify.send_message
        target:
          device_id: !input notify_device
        data:
          title: "Cảnh báo bão"
          message: "{{ ket_qua.message_short }}"

      # 2. Gửi Zalo mặc định
      - action: zalo_bot.send_message
        data:
          thread_id: !input zalo_thread_id
          account_selection: !input zalo_account
          type: !input zalo_type
          message: "{{ ket_qua.message }}"

      # 3. Gửi Telegram (bật/tắt bằng input enable_telegram)
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ enable_telegram }}"
            sequence:
              - action: "{{ telegram_service }}"
                data:
                  title: "🌪️ Cảnh báo bão KTTV"
                  message: "{{ ket_qua.message }}"

      # 4. Chạy các Action thêm được người dùng cấu hình trên UI
      - choose: []
        default: !input additional_actions

mode: single
