blueprint:
  name: Send summary to Zalo + Speaker (DLNA Stable Full - Extended Weather/Sensors)
  domain: automation
  author: smarthomeblack + GPT
  description: Morning summary with  weather/environmental sensors, calendar, todo, news, and speaker/Zalo notification.

  input:
    notify_time:
      name: Notification Time
      selector:
        time: {}
      default: "06:15:00"

    # ===== ZALO =====
    enable_zalo:
      name: Enable Send to Zalo
      selector:
        boolean: {}
      default: true

    zalo_thread_id:
      selector:
        text: {}

    zalo_account_selection:
      selector:
        text: {}

    zalo_type:
      selector:
        select:
          options:
            - label: Personal
              value: "0"
            - label: Group
              value: "1"
      default: "1"

    zalo_ttl:
      selector:
        number:
          min: 0
          max: 86400000
          step: 1000
      default: 0

    # ===== DATA =====
    calendar_entity:
      selector:
        entity:
          multiple: true
          filter:
            - domain: calendar

    calendar_duration:
      selector:
        duration: {}
      default:
        hours: 18

    todo_entity:
      selector:
        entity:
          multiple: true
          filter:
            - domain: todo
      default: []

    # Cập nhật chọn nhiều domain liên quan đến thời tiết & môi trường
    weather_entities:
      name: Weather & Environmental Entities
      description: Chọn các entity thời tiết (weather) hoặc cảm biến liên quan (sensor/binary_sensor như nồng độ CO, cảm biến mưa, AQI, cảnh báo thời tiết cực đoan...).
      selector:
        entity:
          multiple: true
          filter:
            - domain: weather
            - domain: sensor
            - domain: binary_sensor
      default: []

    # ===== DAILY HOT NEWS =====
    enable_daily_news:
      name: Enable Daily Hot News
      description: Cho AI tự tìm và tóm tắt các tin nổi bật trong ngày.
      selector:
        boolean: {}
      default: true

    news_lookback_hours:
      name: News Lookback Hours
      description: Khoảng thời gian ưu tiên khi tìm tin mới.
      selector:
        number:
          min: 1
          max: 72
          step: 1
      default: 24

    # LƯU Ý: Cần đã tạo sẵn script "Perform Google Search" (entity_id: script.perform_google_search)
    # theo blueprint của luuquangvu. Automation này sẽ gọi trực tiếp script đó để lấy tin tức THẬT,
    # thay vì để AI tổng hợp tự quyết định có tìm kiếm hay không.

    custom_footer:
      selector:
        text:
          multiline: true
      default: ""

    conversation_agent:
      selector:
        conversation_agent: {}

    prompt:
      selector:
        text:
          multiline: true
      default: >-
        Please generate a friendly morning summary message in Vietnamese for the user.
        - Your responses should always be helpful, warm, and informative.
        - Avoid technical details or specific system information.
        - Compose messages to motivate the user.
        - Include notes on exceptional weather suitable for the season, with recommendations on what to wear today (e.g., long pants, shorts, (light) jacket, sweater).
        - Mention upcoming meetings or appointments only if they exist. List events chronologically, showing the date and time.
        - Do not inform about the absence of appointments.
        - If you have a to-do list, summarize the most important tasks for the day. Prioritize them by due date. If any tasks are overdue, remind the user.
        - Highlight special occasions such as birthdays or anniversaries.
        - Add emojis to make the message more engaging.
        - Ensure correct grammar and meaningful sentence structure.
        - Use paragraphs to organize different sections (weather, calendar, tasks).
        - Check state all weather & environmental devices/sensors provided.
        - Bản tin chi tiết về các tin nổi bật: sử dụng script.perform_google_search để tìm kiếm các thông tin sau
          🌧️ Thời tiết, bão, áp thấp, thiên tai nếu có
          💰 Kinh tế
          🔥 Sự kiện nổi bật
          🏛️ Chính trị
          ⚽ Thể thao Việt Nam

    # ===== SPEAKER =====
    speaker:
      selector:
        entity:
          domain: media_player
      default: ""

    # ===== ALARM =====
    enable_alarm:
      name: Enable Alarm
      selector:
        boolean: {}
      default: true

    alarm_url:
      name: Alarm URL
      selector:
        text: {}
      default: "http://homeassistant.local:8123/local/audio/baothuc.mp3"

    alarm_repeat:
      name: Alarm Repeat
      selector:
        number:
          min: 1
          max: 20
          step: 1
      default: 2

    alarm_duration:
      name: Alarm duration (seconds)
      description: Length of alarm audio file
      selector:
        number:
          min: 1
          max: 600
          step: 1
      default: 8

    alarm_volume:
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
      default: 0.7

    delay_before_tts:
      selector:
        number:
          min: 0
          max: 60
          step: 1
      default: 2

    # ===== TTS =====
    enable_tts:
      selector:
        boolean: {}
      default: true

    tts_engine:
      selector:
        entity:
          domain: tts

    tts_volume:
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
      default: 0.6

trigger:
  - platform: time
    at: !input notify_time

action:
  - variables:
      weather_entities: !input weather_entities
      enable_daily_news: !input enable_daily_news
      news_lookback_hours: !input news_lookback_hours
      calendar_entity: !input calendar_entity
      todo_entity: !input todo_entity
      calendar_duration: !input calendar_duration
      prompt: !input prompt
      custom_footer: !input custom_footer
      speaker: !input speaker
      enable_zalo: !input enable_zalo
      enable_alarm: !input enable_alarm
      enable_tts: !input enable_tts
      alarm_url: !input alarm_url
      alarm_repeat: !input alarm_repeat
      alarm_duration: !input alarm_duration
      alarm_volume: !input alarm_volume
      delay_before_tts: !input delay_before_tts
      tts_engine: !input tts_engine
      tts_volume: !input tts_volume

  # TỔNG HỢP DỮ LIỆU CÁC ENTITY THỜI TIẾT & CẢM BIẾN MÔI TRƯỜNG
  - variables:
      weather_summary: >-
        {% set ns = namespace(lines=[]) %}
        {% for entity in weather_entities %}
          {% set state_val = states(entity) %}
          {% set name_val = state_attr(entity, 'friendly_name') or entity %}
          {% set unit_val = state_attr(entity, 'unit_of_measurement') or '' %}
          {% set line = name_val ~ ' (' ~ entity ~ '): ' ~ state_val ~ ' ' ~ unit_val %}
          {% set ns.lines = ns.lines + [line] %}
        {% endfor %}
        {{ ns.lines | join('\n') }}

  # ===== CALENDAR =====
  - service: calendar.get_events
    data:
      duration: !input calendar_duration
    target:
      entity_id: !input calendar_entity
    response_variable: calendar_response

  # ===== TODO =====
  - service: todo.get_items
    data:
      status:
        - needs_action
    target:
      entity_id: !input todo_entity
    response_variable: todo_response

  # ===== TÌM KIẾM TIN TỨC THẬT (gọi trực tiếp script, KHÔNG để AI tự quyết định) =====
  - choose:
      - conditions:
          - "{{ enable_daily_news }}"
        sequence:
          - service: script.perform_google_search
            data:
              query_string: >-
                Tìm tin tức Việt Nam mới nhất trong {{ news_lookback_hours }} giờ qua, tách riêng theo 3 mục sau và ghi rõ tiêu đề mục trước mỗi phần:
                MỤC 1 - THỜI TIẾT/BÃO: thời tiết, bão, áp thấp nhiệt đới, mưa lớn, thiên tai.
                MỤC 2 - KINH TẾ: giá vàng, tỷ giá, lãi suất, thị trường chứng khoán, chính sách kinh tế.
                MỤC 3 - SỰ KIỆN: sự kiện, tin tức xã hội nổi bật trong ngày.
                Mỗi mục tìm và trả lời riêng, có số liệu/tên riêng cụ thể, kèm tên nguồn báo.
              language: "vi-VN"
            response_variable: search_group1

          - service: script.perform_google_search
            data:
              query_string: >-
                Tìm tin tức Việt Nam mới nhất trong {{ news_lookback_hours }} giờ qua, tách riêng theo 2 mục sau và ghi rõ tiêu đề mục trước mỗi phần:
                MỤC 1 - CHÍNH TRỊ: các diễn biến chính trị nổi bật từ nguồn chính thống.
                MỤC 2 - THỂ THAO: thể thao Việt Nam, bóng đá Việt Nam.
                Mỗi mục tìm và trả lời riêng, có số liệu/tên riêng cụ thể, kèm tên nguồn báo.
              language: "vi-VN"
            response_variable: search_group2

          - variables:
              news_raw: >-
                {{ search_group1.get('response', {}).get('speech', {}).get('plain', {}).get('speech', 'Không có dữ liệu.') }}

                {{ search_group2.get('response', {}).get('speech', {}).get('plain', {}).get('speech', 'Không có dữ liệu.') }}
      - conditions:
          - "{{ not enable_daily_news }}"
        sequence:
          - variables:
              news_raw: ""

  # ===== AI SUMMARY =====
  - service: conversation.process
    data:
      text: |
        Bạn là trợ lý chính của Home Assistant 
        Bạn CHỈ có nhiệm vụ TỔNG HỢP và TRÌNH BÀY LẠI dữ liệu đã được cung cấp sẵn bên dưới (thời tiết, lịch, todo, tin tức).
        Dữ liệu tin tức bên dưới ĐÃ được tìm kiếm thật từ Google trước đó — TUYỆT ĐỐI KHÔNG được tự tìm kiếm thêm, KHÔNG được suy đoán hay bịa thêm bất kỳ thông tin nào không có trong dữ liệu được cung cấp.
        THỜI GIAN HIỆN TẠI:
        {{ now().strftime('%A, %d/%m/%Y %H:%M') }}

        DỮ LIỆU THỜI TIẾT VÀ CẢM BIẾN MÔI TRƯỜNG TỪ HOME ASSISTANT:
        {{ weather_summary }}

        LỊCH:
        {{ calendar_response }}

        TODO:
        {{ todo_response }}

        YÊU CẦU RIÊNG CỦA NGƯỜI DÙNG:
        {{ prompt }}

        GHI CHÚ THÊM:
        {{ custom_footer }}

        ===== NHIỆM VỤ =====
        Hãy tạo một bản tin buổi sáng bằng tiếng Việt, tự nhiên, thân thiện và dễ nghe khi đọc qua TTS.

        1. THỜI TIẾT VÀ CẢNH BÁO MÔI TRƯỜNG
        - Phân tích toàn bộ danh sách entity thời tiết và các cảm biến môi trường được cung cấp (nhiệt độ, mưa, chất lượng không khí, nồng độ CO, cảnh báo thời tiết cực đoan...).
        - Đưa ra đánh giá tổng quan và chi tiết về tình hình thời tiết/môi trường xung quanh.
        - ĐẶC BIỆT: Nếu phát hiện các chỉ số bất thường hoặc nguy hiểm (như nồng độ CO cao, mưa lớn, thời tiết cực đoan, chỉ số ô nhiễm cao...), phải đưa ra CẢNH BÁO NỔI BẬT ngay lập tức.
        - Đưa ra lời khuyên trang phục thích hợp (áo khoác, quần dài, áo phông...) và các khuyến nghị an toàn thực tế (ví dụ: bật quạt thông gió nếu CO cao, đóng cửa sổ khi ô nhiễm/mưa, mang theo ô/áo mưa...).

        2. LỊCH VÀ TODO
        - Tóm tắt các lịch quan trọng trong ngày theo thứ tự thời gian. Không báo nếu không có lịch.
        - Nhắc các việc TODO cần hoàn thành, ưu tiên việc quá hạn hoặc sát giờ.
        - Nhắc nhở các sự kiện đặc biệt nếu có (sinh nhật, kỷ niệm...).

        3. BẢN TIN HOT TRONG NGÀY
        {% if enable_daily_news %}
        DƯỚI ĐÂY LÀ KẾT QUẢ TÌM KIẾM THẬT ĐÃ ĐƯỢC LẤY SẴN TỪ GOOGLE. CHỈ được dùng đúng nội dung này, TUYỆT ĐỐI KHÔNG được tự bịa thêm hay suy đoán:

        {{ news_raw }}

        Yêu cầu trình bày:
        - Tóm tắt lại theo đúng 5 nhóm: 🌧️ Thời tiết/Bão, 💰 Kinh tế, 🔥 Sự kiện, 🏛️ Chính trị, ⚽ Thể thao.
        - Mỗi nhóm viết 2-4 câu CỤ THỂ, giữ lại số liệu, tên riêng, địa danh có trong dữ liệu trên. KHÔNG viết chung chung kiểu "tiếp tục theo dõi", "duy trì quan tâm ổn định".
        - Nếu dữ liệu có ghi tên nguồn báo (VD: VnExpress, Tuổi Trẻ, Vietnam+, Dân trí...) thì giữ lại trong ngoặc đơn ở cuối câu tương ứng.
        - Nếu một nhóm không có dữ liệu thật (ghi "Không có dữ liệu."), thì viết "Chưa có tin mới đáng chú ý" cho nhóm đó — TUYỆT ĐỐI không bịa nội dung thay thế.
        {% else %}
        Không tìm kiếm và không đưa phần tin tức.
        {% endif %}

        4. CẤU TRÚC ĐẦU RA
        - Lời chào buổi sáng ấm áp, truyền cảm hứng.
        - Phân đoạn thời tiết, môi trường & khuyến nghị trang phục/an toàn.
        - Phân đoạn Lịch & Công việc (dùng đoạn văn hoặc danh sách ngắn).
        - Phân đoạn Bản tin hot.
        - Kết thúc bằng lời chúc ngắn gọn.
        - Chèn emoji hợp lý để tin nhắn sinh động.
        - Tránh bảng biểu hoặc markdown quá phức tạp để đọc TTS và gửi Zalo mượt mà.
        - trình bày rõ ràng, rành mạch , ngắt câu ngắt dòng , xuống dòng chính xác
      agent_id: !input conversation_agent
    response_variable: agent

  # ===== SEND ZALO =====
  - choose:
      - conditions:
          - "{{ enable_zalo }}"
        sequence:
          - service: zalo_bot.send_message
            data:
              message: "{{ agent.response.speech.plain.speech }}"
              thread_id: !input zalo_thread_id
              account_selection: !input zalo_account_selection
              type: !input zalo_type
              ttl: !input zalo_ttl

  # ===== ALARM LOOP (DLNA STABLE) =====
  - choose:
      - conditions:
          - "{{ enable_alarm and speaker != '' }}"
        sequence:
          - service: media_player.volume_set
            target:
              entity_id: "{{ speaker }}"
            data:
              volume_level: "{{ alarm_volume }}"

          - repeat:
              count: "{{ alarm_repeat }}"
              sequence:
                - service: media_player.play_media
                  target:
                    entity_id: "{{ speaker }}"
                  data:
                    media_content_id: "{{ alarm_url }}"
                    media_content_type: music

                - delay:
                    seconds: "{{ alarm_duration }}"

                - service: media_player.media_stop
                  target:
                    entity_id: "{{ speaker }}"

                - delay: "00:00:01"

  # ===== DELAY BEFORE TTS =====
  - delay:
      seconds: "{{ delay_before_tts }}"

  # ===== TTS =====
  - choose:
      - conditions:
          - "{{ enable_tts and speaker != '' }}"
        sequence:
          - service: media_player.volume_set
            target:
              entity_id: "{{ speaker }}"
            data:
              volume_level: "{{ tts_volume }}"

          - service: tts.speak
            target:
              entity_id: !input tts_engine
            data:
              media_player_entity_id: "{{ speaker }}"
              message: "{{ agent.response.speech.plain.speech }}"

mode: single
