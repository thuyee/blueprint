blueprint:
  name: Get Home Weather Forecast
  author: luuquangvu (modified)
  source_url: https://github.com/luuquangvu/tutorials/blob/main/weather_forecast_full_llm.yaml
  description: |-
    # Tool for requesting the weather forecast AND current conditions,
    # used for Voice Assistant

    ### Blueprint setup

    #### Required

    * Set a weather entity to use for the forecasts

    #### Optional but recommended

    * Set the extra sensors (humidity, pressure, wind, cloud, UV, PM2.5,
      air quality category, RealFeel...) if your AccuWeather integration
      exposes them as separate `sensor.*` entities. Leave any of them
      empty if you don't have that sensor.

    ### What changed vs the original

    - The response now ALSO contains a `current` block with the live
      readings (independent from the requested forecast period) plus a
      ready-made `formatted_message` string in Vietnamese, styled like
      a weather-bot reply (bold labels, emoji, and a short friendly
      "Lưu ý" advice line). The LLM can relay `current.formatted_message`
      almost verbatim when asked about the weather right now, instead of
      needing a long prompt to build the formatting itself.
    - The original `forecast` behavior (hourly/daily periods) is 100%
      unchanged and still available under the `forecast` key of the
      response, for future-looking questions ("ngày mai thế nào").

    ### Note

    - Provide a concise and precise description for the script. This will be utilized by the LLM to understand it should use this script for requesting the weather forecast.
    - Make sure to expose the script to Assist after the script has been saved.
    - Do not alter the default script name.
    - Once the script is created, click the three dots in the top right corner, choose "Edit in YAML," and remove the `description: ...` line to restore the default. This step is important because it helps the LLM better understand the script's purpose.

    ### Credit

    - Special thanks to the original blueprint from [TheFes/ha-blueprints](https://github.com/TheFes/ha-blueprints). This version has been refined and optimized specifically for use with Gemini.
  domain: script
  homeassistant:
    min_version: 2024.12.0
  input:
    weather_settings:
      name: Weather settings
      icon: mdi:weather-lightning-rainy
      description: Here you need to select the weather entity you want to use
      input:
        weather_entity:
          name: Weather entity
          description:
            Select the weather entity to use for the forecast. Needs to
            be a weather entity which provides an hourly and daily forecast
          selector:
            entity:
              multiple: false
              filter:
                - domain:
                    - weather
        calc_average:
          name: Calculate averages
          description:
            "When this is enabled, the LLM will only receive the average
            of the data for the selected period, instead of the data for each hour/day.
            For text fields like the current condition, the most frequent value will
            be sent.

            When disabled all data for each hour or day will be sent."
          selector:
            boolean: {}
          default: true
        location_name:
          name: Tên khu vực hiển thị (tùy chọn)
          description: Nếu để trống sẽ tự lấy tên khu vực (area) của weather entity.
          default: ""
          selector:
            text: {}
    current_conditions_settings:
      name: Sensor bổ sung cho thời tiết hiện tại (tùy chọn)
      icon: mdi:weather-partly-rainy
      description: >
        Để trống sensor nào thì dòng đó sẽ tự động không xuất hiện trong
        câu trả lời thời tiết hiện tại.
      collapsed: true
      input:
        humidity_entity:
          name: Độ ẩm (tùy chọn)
          default: ""
          selector:
            entity:
              domain: sensor
        pressure_entity:
          name: Áp suất (tùy chọn)
          default: ""
          selector:
            entity:
              domain: sensor
        wind_speed_entity:
          name: Tốc độ gió (tùy chọn)
          default: ""
          selector:
            entity:
              domain: sensor
        wind_bearing_entity:
          name: Hướng gió (tùy chọn)
          default: ""
          selector:
            entity:
              domain: sensor
        cloud_entity:
          name: Lượng mây % (tùy chọn)
          default: ""
          selector:
            entity:
              domain: sensor
        realfeel_entity:
          name: Nhiệt độ cảm nhận - RealFeel (tùy chọn)
          default: ""
          selector:
            entity:
              domain: sensor
        uv_entity:
          name: Chỉ số UV (tùy chọn)
          default: ""
          selector:
            entity:
              domain: sensor
        pm25_entity:
          name: PM2.5 (tùy chọn)
          default: ""
          selector:
            entity:
              domain: sensor
        aqi_category_entity:
          name: Mức chất lượng không khí - text (tùy chọn)
          default: ""
          selector:
            entity:
              domain: sensor
    prompt_settings:
      name: Prompt settings for the LLM
      icon: mdi:robot
      description:
        You can use these settings to finetune the prompts for your specific
        LLM (model). In most cases the defaults should be fine.
      collapsed: true
      input:
        time_period_type_prompt:
          name: Time period type prompt
          description: The prompt used by the AI to identify the period type (daily or hourly)
          selector:
            text:
              multiline: true
              multiple: false
          default: |-
            daily or hourly. Default daily
        time_period_length_prompt:
          name: Time period length prompt
          description: The prompt used by the AI to identify the period length
          selector:
            text:
              multiline: true
              multiple: false
          default: |-
            Length in days (daily) or hours (hourly). Default 1
        date_prompt:
          name: Date prompt
          description: The prompt used by the AI to identify the starting date
          selector:
            text:
              multiline: true
              multiple: false
          default: |-
            Start date (YYYY-MM-DD). Default today. Night=next day if >=05:00:00
        time_prompt:
          name: Time prompt
          description: The prompt used by the AI to identify the starting time
          selector:
            text:
              multiline: true
              multiple: false
          default: |-
            Start time (HH:MM:SS). Default 00:00:00 for daily, current time for hourly
mode: parallel
max_exceeded: silent
description: >-
  Retrieves the current weather conditions (with a ready-made friendly
  reply text including advice) and/or the hourly/daily weather forecast.
variables:
  version: 20260829
fields:
  time_period_type:
    name: Time Period Type
    description: !input time_period_type_prompt
    selector:
      select:
        options:
          - daily
          - hourly
    default: daily
  time_period_length:
    name: Time Period Length
    description: !input time_period_length_prompt
    selector:
      number:
        min: 1
        max: 48
    default: 1
  start_date:
    name: Start Date
    description: !input date_prompt
    selector:
      date:
  start_time:
    name: Start Time
    description: !input time_prompt
    selector:
      time:
sequence:
  - variables:
      weather_entity: !input weather_entity
      location_name: !input location_name
      humidity_entity: !input humidity_entity
      pressure_entity: !input pressure_entity
      wind_speed_entity: !input wind_speed_entity
      wind_bearing_entity: !input wind_bearing_entity
      cloud_entity: !input cloud_entity
      realfeel_entity: !input realfeel_entity
      uv_entity: !input uv_entity
      pm25_entity: !input pm25_entity
      aqi_category_entity: !input aqi_category_entity
      supported: >
        {% set sf = state_attr(weather_entity, 'supported_features') | int(0) %}
        {% set d = ['daily'] if sf | bitwise_and(1) else [] %}
        {% set h = ['hourly'] if sf | bitwise_and(2) else [] %}
        {% set td = ['twice_daily'] if sf | bitwise_and(4) else [] %}
        {{ d + h + td }}
      _period_type: "{{ time_period_type if (time_period_type | default) in ['daily', 'hourly', 'twice_daily'] else 'daily' }}"
      time_period_type: >
        {{
          'twice_daily'
            if _period_type not in supported
            and _period_type == 'daily'
            and 'twice_daily' in supported
          else _period_type
        }}
      _add_length: "{{ (time_period_length | default(1) | int(1)) | abs }}"
      _start_date_raw: "{{ start_date | default('', true) | trim }}"
      _start_time_raw: "{{ start_time | default('', true) | trim }}"
      _start_date_val: >-
        {% if _start_date_raw != '' %}
          {% set parsed = _start_date_raw | as_datetime(default=none) %}
          {{ (parsed.date() | string) if parsed is not none else _start_date_raw }}
        {% else %}
          {{ now().strftime('%Y-%m-%d') }}
        {% endif %}
      _start_time_val: >-
        {% if _start_time_raw != '' %}
          {{ _start_time_raw }}
        {% elif time_period_type == 'hourly' and (_start_date_val == now().strftime('%Y-%m-%d')) %}
          {{ now().strftime('%H:%M:%S') }}
        {% else %}
          00:00:00
        {% endif %}
      start: >-
        {% set dt_str = _start_date_val ~ ' ' ~ _start_time_val %}
        {% set dt = dt_str | as_datetime(default=none) %}
        {{ (dt | as_local).isoformat() if dt is not none else 'NA' }}
      end: >-
        {% if start != 'NA' %}
          {% set start_dt = as_datetime(start) %}
          {{ (start_dt + timedelta(days = _add_length if time_period_type in ['daily', 'twice_daily'] else 0, hours = _add_length if time_period_type == 'hourly' else 0)) | as_local | string }}
        {% else %}
          NA
        {% endif %}
  - alias: Check if variables were set correctly
    if:
      - condition: template
        value_template: "{{ start == 'NA' or (end | as_datetime | default(now(), true) < now()) }}"
    then:
      - alias: Set variable for eror message
        variables:
          response:
            error:
              Unable to provide forecast because not all parameters were set by the
              AI agent
      - alias: Stop the script
        stop:
          Unable to determine the date for the weather forecast, or the date is in
          the past
        response_variable: response
  - if: "{{ time_period_type not in supported }}"
    then:
      - alias: Set variable for eror message
        variables:
          response:
            error:
              Unable to provide forecast because the weather provider doesn't provide
              the {{ time_period_type }} forecast data
      - alias: Stop the script
        stop: Weather provider doesn't provide {{ time_period_type }} forecast data
        response_variable: response
    else:
      - action: weather.get_forecasts
        data:
          type: "{{ time_period_type }}"
        target:
          entity_id: !input weather_entity
        response_variable: weather_response
      - variables:
          calc_average: !input calc_average
          selected_data: >-
            {% set ns = namespace(forecast=[]) %}
            {% for item in weather_response[weather_entity].forecast %}
              {% if start | as_datetime <= item.datetime | as_datetime | as_local < end | as_datetime %}
                {% set ns.forecast = ns.forecast + [item] %}
              {% endif %}
            {% endfor %}
            {{
              dict(
                current_context=dict(
                  current_time=now().strftime('%A, %Y-%m-%d %H:%M:%S %z'),
                  timezone=now().tzinfo | string
                ),
                start_of_period=start,
                end_of_period=end,
                forecast=ns.forecast
              )
            }}
          averaged:
            averaged_weather_data_for_period:
              "{% set ns = namespace(combined={}) %}

              {% set weather_data = selected_data.forecast if selected_data is mapping and selected_data.forecast is defined else [] %}

              {% set first_forecast = weather_data[0] if weather_data else {} %}

              {% set forecast_keys = first_forecast.keys() | reject('eq', 'datetime') %}

              {% for item in forecast_keys %}

              {% set combine = weather_data | selectattr(item, 'defined') | map(attribute=item) | list %}

              {% set combine = combine | statistical_mode if combine | count > 0 and combine[0] is string else combine | average(none) %}

              {% set combine = combine | round(1 if combine < 1 else 0) if combine | is_number else combine %}

              {% set ns.combined = (dict(ns.combined, **{item: combine})) if combine is not none else ns.combined %}

              {% endfor %}

              {{ dict(
              current_context=dict(
              current_time=now().strftime('%A, %Y-%m-%d %H:%M:%S %z'),
              timezone=now().tzinfo | string
              ),
              start_of_period=start,
              end_of_period=end,
              **ns.combined
              ) }}"
          forecast_result: "{{ averaged if calc_average else selected_data }}"

      # ============ PHẦN MỚI: THỜI TIẾT HIỆN TẠI + LỜI KHUYÊN ============
      - variables:
          cur_condition: "{{ states(weather_entity) }}"
          cur_temp: "{{ state_attr(weather_entity, 'temperature') }}"
          cur_humidity: >
            {{ states(humidity_entity) if humidity_entity != '' and states(humidity_entity) not in ['unknown','unavailable']
               else state_attr(weather_entity, 'humidity') }}
          cur_pressure: >
            {{ states(pressure_entity) if pressure_entity != '' and states(pressure_entity) not in ['unknown','unavailable']
               else state_attr(weather_entity, 'pressure') }}
          cur_wind_speed: >
            {{ states(wind_speed_entity) if wind_speed_entity != '' and states(wind_speed_entity) not in ['unknown','unavailable']
               else state_attr(weather_entity, 'wind_speed') }}
          cur_wind_bearing: >
            {{ states(wind_bearing_entity) if wind_bearing_entity != '' and states(wind_bearing_entity) not in ['unknown','unavailable']
               else state_attr(weather_entity, 'wind_bearing') }}
          cur_cloud: >
            {{ states(cloud_entity) if cloud_entity != '' and states(cloud_entity) not in ['unknown','unavailable']
               else state_attr(weather_entity, 'cloud_coverage') }}
          cur_realfeel: "{{ states(realfeel_entity) if realfeel_entity != '' and states(realfeel_entity) not in ['unknown','unavailable'] else none }}"
          cur_uv: "{{ states(uv_entity) if uv_entity != '' and states(uv_entity) not in ['unknown','unavailable'] else none }}"
          cur_pm25: "{{ states(pm25_entity) if pm25_entity != '' and states(pm25_entity) not in ['unknown','unavailable'] else none }}"
          cur_aqi_cat: "{{ states(aqi_category_entity) if aqi_category_entity != '' and states(aqi_category_entity) not in ['unknown','unavailable'] else none }}"
          resolved_location: "{{ location_name if location_name != '' else (area_name(weather_entity) or weather_entity) }}"
      - variables:
          cur_wind_dir_text: >
            {% if cur_wind_bearing not in [none, 'unknown', 'unavailable', ''] %}
              {% set deg = cur_wind_bearing | float(0) %}
              {% set dirs = ['Bắc','Bắc-Đông Bắc','Đông Bắc','Đông-Đông Bắc','Đông','Đông-Đông Nam','Đông Nam','Nam-Đông Nam','Nam','Nam-Tây Nam','Tây Nam','Tây-Tây Nam','Tây','Tây-Tây Bắc','Tây Bắc','Bắc-Tây Bắc'] %}
              {{ dirs[ ((deg % 360) / 22.5) | round(0, 'floor') | int ] }}
            {% else %}
              {{ none }}
            {% endif %}
          cur_condition_vn: >
            {{ {
              'sunny': 'Nắng ☀️',
              'clear-night': 'Đêm quang mây 🌙',
              'partlycloudy': 'Ít mây ⛅',
              'cloudy': 'Nhiều mây ☁️',
              'rainy': 'Mưa 🌧️',
              'pouring': 'Mưa to 🌧️',
              'lightning': 'Dông ⛈️',
              'lightning-rainy': 'Mưa dông ⛈️',
              'snowy': 'Tuyết ❄️',
              'snowy-rainy': 'Mưa tuyết 🌨️',
              'fog': 'Sương mù 🌫️',
              'hail': 'Mưa đá 🧊',
              'windy': 'Gió mạnh 💨',
              'windy-variant': 'Gió mạnh 💨',
              'exceptional': 'Thời tiết bất thường ⚠️'
            }.get(cur_condition, cur_condition) }}
          cur_header_emoji: >
            {{ {
              'sunny': '☀️','clear-night': '🌙','partlycloudy': '⛅','cloudy': '☁️',
              'rainy': '🌧️','pouring': '🌧️','lightning': '⛈️','lightning-rainy': '⛈️',
              'snowy': '❄️','snowy-rainy': '🌨️','fog': '🌫️','hail': '🧊',
              'windy': '💨','windy-variant': '💨','exceptional': '⚠️'
            }.get(cur_condition, '🌤️') }}
          cur_note: >
            {% if cur_condition in ['rainy','pouring','lightning-rainy'] %}
              Đang mưa, sếp ra đường mang ô, cẩn thận đường trơn ạ!
            {% elif cur_condition == 'lightning' %}
              Trời đang có dông, sếp hạn chế ra ngoài và tránh xa nơi trống trải ạ!
            {% elif cur_uv is not none and cur_uv | float(0) >= 6 %}
              Chỉ số UV khá cao, sếp nhớ chống nắng khi ra ngoài ạ!
            {% elif cur_pm25 is not none and cur_pm25 | float(0) > 35 %}
              Không khí hôm nay không tốt lắm, sếp cân nhắc đeo khẩu trang ạ!
            {% else %}
              Thời tiết khá ổn, sếp ra đường thoải mái ạ!
            {% endif %}
          cur_formatted_message: >
            {{ cur_header_emoji }} **Thời tiết {{ resolved_location }} ({{ now().strftime('%d/%m/%Y') }} ~{{ now().strftime('%H:%M') }}):**


            - Trời: {{ cur_condition_vn }}

            - Nhiệt độ: {{ cur_temp }}°C{% if cur_realfeel is not none %} (cảm giác như {{ cur_realfeel }}°C){% endif %}

            {% if cur_humidity is not none %}- Độ ẩm: {{ cur_humidity }}%
            {% endif %}
            {% if cur_cloud is not none %}- Mây: {{ cur_cloud }}% ({{ 'đầy mây' if cur_cloud|float(0) >= 80 else ('nhiều mây' if cur_cloud|float(0) >= 40 else 'quang đãng') }})
            {% endif %}
            {% if cur_wind_speed is not none %}- Gió: {{ cur_wind_speed }} km/h{% if cur_wind_dir_text is not none %}, hướng {{ cur_wind_dir_text }}{% endif %}
            {% endif %}
            {% if cur_pressure is not none %}- Áp suất: {{ cur_pressure }} hPa
            {% endif %}
            {% if cur_uv is not none %}- UV: {{ cur_uv }} ({{ 'thấp' if cur_uv|float(0) < 3 else ('trung bình' if cur_uv|float(0) < 6 else ('cao' if cur_uv|float(0) < 8 else 'rất cao')) }})
            {% endif %}
            {% if cur_aqi_cat is not none or cur_pm25 is not none %}- Chất lượng không khí: {% if cur_aqi_cat is not none %}{{ cur_aqi_cat }}{% endif %}{% if cur_pm25 is not none %} (PM2.5: {{ cur_pm25 }} µg/m³){% endif %}

            {% endif %}

            ⚠️ **Lưu ý:** {{ cur_note }}
          current_result:
            location: "{{ resolved_location }}"
            condition: "{{ cur_condition }}"
            temperature: "{{ cur_temp }}"
            feels_like: "{{ cur_realfeel }}"
            humidity_percent: "{{ cur_humidity }}"
            cloud_coverage_percent: "{{ cur_cloud }}"
            wind_speed: "{{ cur_wind_speed }}"
            wind_direction: "{{ cur_wind_dir_text }}"
            pressure_hpa: "{{ cur_pressure }}"
            uv_index: "{{ cur_uv }}"
            pm2_5: "{{ cur_pm25 }}"
            air_quality_category: "{{ cur_aqi_cat }}"
            advice: "{{ cur_note }}"
            formatted_message: "{{ cur_formatted_message }}"
      # ============ HẾT PHẦN MỚI ============

      - variables:
          response:
            current: "{{ current_result }}"
            forecast: "{{ forecast_result }}"
      - stop: ""
        response_variable: response
